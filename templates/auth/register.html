<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Регистрация</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
    {% include "_theme_boot.html" %}
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="code-bg-page">
    {% include "_code_background.html" %}
    <main class="auth-shell">
        <section class="auth-card">
            <p class="eyebrow">Аккаунт ученика</p>
            <h1>Регистрация</h1>
            {% if error %}
                <p class="form-error">{{ error }}</p>
            {% endif %}
            <form method="post">
                <label>Имя</label>
                <input name="name" required>
                <label>Почта</label>
                <input name="email" type="email" required>
                <label>Пароль</label>
                <input name="password" type="password" required>
                <button class="primary-link" type="submit">Создать аккаунт</button>
            </form>
            <a class="plain-link" href="{{ url_for('login') }}">Уже есть аккаунт</a>
        </section>
    </main>
</body>
</html>
