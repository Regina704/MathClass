<div class="code-hero-bg math-ambient-bg" aria-hidden="true">
    <div class="code-grid-bg"></div>
    <svg class="math-curve-field" viewBox="0 0 1440 900" preserveAspectRatio="none">
        <defs>
            <filter id="mathCurveGlow" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="5" result="blur"/>
                <feMerge>
                    <feMergeNode in="blur"/>
                    <feMergeNode in="SourceGraphic"/>
                </feMerge>
            </filter>
            <path id="curveSine" d="M -180 505 C 40 360 210 640 380 505 S 700 365 870 505 S 1190 645 1360 505 S 1640 365 1740 505"/>
            <path id="curveParabola" d="M -180 780 C 160 410 420 260 720 260 S 1280 410 1620 780"/>
            <path id="curveHyperbola" d="M -180 250 C 170 105 390 120 560 265 S 730 620 920 655 S 1260 520 1620 220"/>
        </defs>
        <g class="math-curves" filter="url(#mathCurveGlow)">
            <use href="#curveSine" class="math-curve math-curve-a"/>
            <use href="#curveParabola" class="math-curve math-curve-b"/>
            <use href="#curveHyperbola" class="math-curve math-curve-c"/>
        </g>
        <g class="math-orbs" filter="url(#mathCurveGlow)">
            <circle r="5" class="math-orb math-orb-a" opacity="0">
                <animateMotion dur="54s" repeatCount="indefinite" rotate="auto">
                    <mpath href="#curveSine"/>
                </animateMotion>
                <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.9;1" dur="54s" repeatCount="indefinite"/>
            </circle>
            <circle r="4" class="math-orb math-orb-b" opacity="0">
                <animateMotion dur="68s" begin="16s" repeatCount="indefinite" rotate="auto">
                    <mpath href="#curveParabola"/>
                </animateMotion>
                <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.9;1" dur="68s" begin="16s" repeatCount="indefinite"/>
            </circle>
            <circle r="4.5" class="math-orb math-orb-c" opacity="0">
                <animateMotion dur="78s" begin="34s" repeatCount="indefinite" rotate="auto">
                    <mpath href="#curveHyperbola"/>
                </animateMotion>
                <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.9;1" dur="78s" begin="34s" repeatCount="indefinite"/>
            </circle>
        </g>
    </svg>
    <div class="math-formula-layer" data-math-formulas></div>
</div>
