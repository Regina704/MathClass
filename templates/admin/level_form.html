<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Новый уровень</title>
    {% include "_theme_boot.html" %}
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="code-bg-page">
    {% include "_code_background.html" %}
    <main class="learning-shell">
        {% include "_top_nav.html" %}
        <section class="content-panel admin-form">
            <a class="back-link" href="{{ url_for('admin_dashboard') }}">← Админка</a>
            <h1>Новый уровень</h1>
            <form method="post">
                <label>Урок</label>
                <select name="lesson_id" required>
                    {% for module in modules %}
                        {% for lesson in module.lessons %}
                            <option value="{{ lesson.id }}" {% if lesson_id and lesson.id == lesson_id %}selected{% endif %}>{{ module.title }} / {{ lesson.title }}</option>
                        {% endfor %}
                    {% endfor %}
                </select>
                <label>Название</label>
                <input name="title" required>
                <label>Описание</label>
                <textarea name="description" rows="5"></textarea>
                <button class="primary-link" type="submit">Создать</button>
            </form>
        </section>
    </main>
</body>
</html>
